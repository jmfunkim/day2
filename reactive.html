<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반응형 메뉴 페이지</title>
<style>
  * { box-sizing: border-box; }
  :root { --main: #4f46e5; --bg: #f4f4f8; --line: #e5e7eb; }
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: var(--bg); color: #1f2937; }

  /* 상단바 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 1000px; margin: 0 auto; padding: 0 16px; min-height: 56px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .logo { font-weight: bold; font-size: 1.2rem; color: var(--main); }

  /* 메뉴 (PC: 가로) */
  .menu { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
  .menu button {
    border: none; background: none; cursor: pointer; font: inherit; font-weight: bold;
    padding: 8px 14px; border-radius: 8px; color: #374151;
  }
  .menu button:hover { background: #eef; }
  .menu button.active { background: var(--main); color: #fff; }

  /* 햄버거 버튼 (모바일에서만 보임) */
  .burger {
    display: none; width: 44px; height: 44px; border: none; background: none; cursor: pointer;
    flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0;
  }
  .burger span { display: block; width: 24px; height: 3px; border-radius: 2px; background: #1f2937; transition: transform .25s, opacity .2s; }
  .burger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

  /* 본문 */
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
  .panel { display: none; }
  .panel.show { display: block; }
  .panel h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .panel > p { margin: 0 0 16px; color: #6b7280; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card .emoji { font-size: 2rem; }
  .card h3 { margin: 6px 0 4px; font-size: 1.05rem; }
  .card p { margin: 0; font-size: .9rem; color: #6b7280; }
  footer { text-align: center; color: #9ca3af; font-size: .85rem; padding: 24px 16px; }

  /* 모바일: 햄버거 + 펼침 메뉴 */
  @media (max-width: 720px) {
    .burger { display: flex; }
    .menu {
      display: none; flex-direction: column; gap: 0; width: 100%;
      border-top: 1px solid var(--line); background: #fff; padding: 8px 0 12px;
    }
    .menu.open { display: flex; }
    .menu button { width: 100%; text-align: left; padding: 14px 12px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="bar">
      <div class="logo">📌 My 카테고리</div>
      <button class="burger" id="burger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menuReal">
        <span></span><span></span><span></span>
      </button>
      <ul class="menu" id="menuReal"></ul>
    </div>
  </div>

  <main id="main"></main>
  <footer>© 2026 반응형 메뉴 페이지</footer>

<script>
  const CATEGORIES = [
    { id: 'food',   name: '🍜 음식',   desc: '오늘 뭐 먹지? 맛집과 레시피를 모아봤어요.',
      items: [['🍣','맛집 탐방','동네 숨은 맛집 모음'], ['🥘','집밥 레시피','15분 완성 요리'], ['☕','카페 추천','분위기 좋은 카페']] },
    { id: 'furn',   name: '🛋️ 가구',   desc: '우리 집을 채우는 가구 이야기.',
      items: [['🛏️','침대·매트리스','숙면을 위한 선택'], ['🪑','의자·책상','오래 앉아도 편한 구성'], ['💡','조명·소품','분위기를 바꾸는 한 끗']] },
    { id: 'estate', name: '🏠 부동산', desc: '집 구하기 전에 꼭 확인할 것들.',
      items: [['🏢','아파트','시세와 단지 정보'], ['🏘️','전·월세','계약 전 체크리스트'], ['📑','계약 가이드','서류와 절차 안내']] },
    { id: 'stock',  name: '📈 주식',   desc: '투자 공부용 정보 모음 (투자 권유가 아닙니다).',
      items: [['📊','시장 동향','지수와 이슈 정리'], ['📚','기초 용어','PER, ETF 쉽게 이해'], ['🧮','수익 계산','수수료·세금 개념']] },
    { id: 'map',    name: '🗺️ 지도',   desc: '길찾기와 주변 탐색.',
      items: [['📍','내 주변','가까운 장소 찾기'], ['🚌','대중교통','경로와 소요 시간'], ['🚗','주차장','근처 주차 정보']] }
  ];

  const menu = document.getElementById('menuReal');
  const main = document.getElementById('main');
  const burger = document.getElementById('burger');

  CATEGORIES.forEach((c, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c.name; b.dataset.id = c.id;
    b.addEventListener('click', () => { show(c.id); closeMenu(); });
    li.append(b); menu.append(li);

    const sec = document.createElement('section');
    sec.className = 'panel'; sec.id = 'p-' + c.id;
    sec.innerHTML = '<h1></h1><p></p><div class="cards"></div>';
    sec.querySelector('h1').textContent = c.name;
    sec.querySelector('p').textContent = c.desc;
    const wrap = sec.querySelector('.cards');
    c.items.forEach(([e, t, d]) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="emoji"></div><h3></h3><p></p>';
      card.children[0].textContent = e; card.children[1].textContent = t; card.children[2].textContent = d;
      wrap.append(card);
    });
    main.append(sec);
  });

  function show(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === 'p-' + id));
    menu.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  }

  function closeMenu() {
    menu.classList.remove('open'); burger.classList.remove('open');
    burger.setAttribute('aria-expanded', 'false'); burger.setAttribute('aria-label', '메뉴 열기');
  }

  burger.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    burger.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  });

  // 화면이 넓어지면 펼침 상태를 초기화
  matchMedia('(min-width: 721px)').addEventListener('change', e => { if (e.matches) closeMenu(); });

  show(CATEGORIES[0].id);
</script>
</body>
</html>
