<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 특산품 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Malgun Gothic", sans-serif;
    background: #fffaf3;
    color: #1f2937;
  }
  header {
    background: #f97316;
    color: #fff;
    padding: 14px 16px;
    text-align: center;
    font-weight: bold;
    font-size: 1.1rem;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .me   { align-self: flex-end;   background: #f97316; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 6px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 999px;
    font-size: 1rem;
  }
  button {
    padding: 0 20px;
    border: none;
    border-radius: 999px;
    background: #f97316;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #ea580c; }
  .notice {
    text-align: center;
    font-size: .75rem;
    color: #9ca3af;
    padding: 4px 16px 12px;
  }
</style>
</head>
<body>
  <header>🍊 제주 특산품 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="notice">※ 지금 답변은 미리 정해 둔 가짜 답변입니다.</div>

<script>
  const REPLIES = [
    '안녕하세요! 제주도 특산품을 알아보는 에이전트예요 🍊\n감귤, 한라봉, 흑돼지, 옥돔 중에 어떤 게 궁금하세요?',
    '추천 하나 드릴게요! 겨울에 제주에 가신다면 한라봉을 드셔 보세요. 당도가 높고 과육이 부드러워 인기가 많아요 🍊',
    '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
  ];
  let turn = 0;

  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');

  function add(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener('submit', e => {
    e.preventDefault();            // Enter 키도 submit으로 처리됩니다.
    const text = input.value.trim();
    if (!text) return;
    add(text, 'me');
    input.value = '';
    const reply = REPLIES[turn++ % REPLIES.length];
    setTimeout(() => add(reply, 'bot'), 1000);
  });
</script>
</body>
</html>
